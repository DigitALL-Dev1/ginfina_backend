<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <aside class="w-1/4 bg-white shadow-md">
            <div class="p-4 border-b">
                <h1 class="text-xl font-bold text-gray-800">GX1 Platform</h1>
            </div>
            <nav class="p-4">
                <button class="w-full bg-green-500 text-white py-2 rounded-md text-left">Forms</button>
            </nav>
        </aside>
        <main class="flex-1 p-6">
            <div class="bg-white p-6 shadow-md rounded-lg">
                <h2 class="text-2xl font-semibold mb-4">Form Submission</h2>
                <form class="space-y-4">
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Field 1 *</label>
                        <input type="text" class="w-full border-gray-300 rounded-md shadow-sm focus:ring focus:ring-green-500 focus:border-green-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Field 2 *</label>
                        <input type="text" class="w-full border-gray-300 rounded-md shadow-sm focus:ring focus:ring-green-500 focus:border-green-500">
                    </div>
                    <div class="pt-4">
                        <button type="submit" class="bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600">Submit</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
