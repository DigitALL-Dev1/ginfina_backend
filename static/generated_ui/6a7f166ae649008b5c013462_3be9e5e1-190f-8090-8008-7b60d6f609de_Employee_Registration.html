<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-700">
    <div class="flex">
        <div class="w-1/4 min-h-screen bg-white p-6 border-r border-gray-200">
            <h1 class="text-xl font-semibold mb-4">GX1 Platform</h1>
            <button class="bg-green-600 text-white px-4 py-2 rounded font-medium">Employees</button>
        </div>
        <div class="flex-grow p-8">
            <h2 class="text-2xl font-semibold mb-6">Employee Registration</h2>
            <div class="bg-white p-6 shadow rounded border border-gray-300">
                <form>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                        <div>
                            <label for="firstName" class="block font-medium mb-1">First Name *</label>
                            <input type="text" id="firstName" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-green-200" required>
                        </div>
                        <div>
                            <label for="lastName" class="block font-medium mb-1">Last Name *</label>
                            <input type="text" id="lastName" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-green-200" required>
                        </div>
                    </div>
                    <div class="mb-6">
                        <label for="email" class="block font-medium mb-1">Email *</label>
                        <input type="email" id="email" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-green-200" required>
                    </div>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded font-medium hover:bg-green-700">Save</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
