<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-1/4 bg-white shadow-lg">
            <div class="p-4">
                <h1 class="text-lg font-bold text-gray-900">GX1 Platform</h1>
                <div class="mt-4">
                    <button class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 focus:outline-none">
                        User Registration
                    </button>
                </div>
            </div>
        </div>
        <!-- Main Content -->
        <div class="flex-grow p-8">
            <div class="bg-white shadow-md p-6 rounded-lg">
                <h2 class="text-2xl font-bold mb-6">User Registration</h2>
                <form class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-900">Username *</label>
                        <input type="text" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:border-green-600" placeholder="Enter username">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-900">Email *</label>
                        <input type="email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:border-green-600" placeholder="Enter email">
                    </div>
                    <button type="submit" class="bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 focus:outline-none">Register</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
