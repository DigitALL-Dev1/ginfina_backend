<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-white shadow-md">
            <div class="p-6">
                <h1 class="text-xl font-bold text-gray-800">GX1 Platform</h1>
            </div>
            <nav class="mt-6">
                <ul>
                    <li>
                        <a class="block px-6 py-3 text-white bg-green-500 rounded">Validation</a>
                    </li>
                </ul>
            </nav>
        </aside>
        <main class="flex-1 p-6">
            <div class="px-6 py-4 border-b border-gray-300">
                <h2 class="text-xl font-semibold text-gray-800">Data Entry Validation</h2>
            </div>
            <div class="mt-6 px-8 py-6 bg-white shadow-md rounded-lg max-w-lg mx-auto">
                <form action="#" method="POST">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Field 1 *</label>
                            <input type="text" class="mt-1 block w-full border-2 border-gray-300 rounded-md p-2 focus:border-green-500 focus:outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Field 2 *</label>
                            <input type="text" class="mt-1 block w-full border-2 border-gray-300 rounded-md p-2 focus:border-green-500 focus:outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Field 3</label>
                            <input type="text" class="mt-1 block w-full border-2 border-gray-300 rounded-md p-2 focus:border-green-500 focus:outline-none">
                        </div>
                    </div>
                    <p class="mt-4 text-sm text-red-500">* Required fields</p>
                    <button type="submit" class="mt-6 px-4 py-2 bg-green-600 text-white font-semibold text-sm rounded hover:bg-green-700 focus:outline-none focus:ring focus:ring-green-300">Submit</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
