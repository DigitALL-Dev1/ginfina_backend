<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<div class="flex min-h-screen">
    <aside class="w-64 bg-white flex-none border-r border-gray-200">
        <div class="p-4">
            <h1 class="text-lg font-bold text-gray-800">GX1 Platform</h1>
        </div>
        <nav class="p-4">
            <button class="block w-full text-left bg-green-500 text-white font-semibold py-2 px-3 rounded-md hover:bg-green-600">
                Users
            </button>
        </nav>
    </aside>
    
    <div class="flex-1 p-8">
        <h2 class="text-xl font-semibold mb-4">User Registration</h2>
        <div class="bg-white p-6 rounded-md border border-gray-300 shadow-sm">
            <form>
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2" for="username">Username *</label>
                    <input type="text" id="username" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2" for="email">Email *</label>
                    <input type="email" id="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <button type="submit" class="bg-green-500 text-white font-semibold py-2 px-4 rounded-md hover:bg-green-600">
                    Register
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
