<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>GX1 Platform - Employee Registration</title>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex">
        <div class="w-1/4 bg-white h-screen border-r">
            <h1 class="text-lg font-bold p-4 text-gray-800">GX1 Platform</h1>
            <div class="p-4">
                <button class="w-full bg-green-600 text-white py-2 px-4 rounded shadow hover:bg-green-700">Employee Registration</button>
            </div>
        </div>
        <div class="flex-1 p-8">
            <div class="border-b mb-4">
                <h2 class="text-2xl font-semibold pb-4">Employee Registration</h2>
            </div>
            <div class="bg-white p-8 shadow-md rounded border">
                <form>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2" for="firstName">First Name *</label>
                            <input type="text" id="firstName" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2" for="lastName">Last Name *</label>
                            <input type="text" id="lastName" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500" required>
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2" for="email">Email *</label>
                        <input type="email" id="email" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500" required>
                    </div>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700">Save</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
