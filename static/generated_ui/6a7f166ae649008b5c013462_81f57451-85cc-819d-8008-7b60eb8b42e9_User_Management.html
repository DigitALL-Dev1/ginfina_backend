<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>User Management</title>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-1/4 bg-white shadow-md">
            <div class="p-6">
                <h1 class="text-lg font-bold">GX1 Platform</h1>
            </div>
            <div class="mt-4">
                <button class="w-full py-2 bg-green-500 text-white rounded-md hover:bg-green-600">Users</button>
            </div>
        </div>
        <!-- Main Content -->
        <div class="flex-1 p-6">
            <h2 class="text-xl font-bold mb-6">User Management</h2>
            <form class="bg-white p-8 shadow-md rounded-lg">
                <div class="mb-4">
                    <label for="email" class="block text-gray-700">User Email *</label>
                    <input type="email" id="email" name="email" class="w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none py-2 mt-1" required>
                </div>
                <div class="mb-6">
                    <label for="date" class="block text-gray-700">Joining Date *</label>
                    <input type="date" id="date" name="date" class="w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none py-2 mt-1" required>
                </div>
                <button type="submit" class="bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600">Update</button>
            </form>
        </div>
    </div>
</body>
</html>
