<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Employee Registration</title>
</head>
<body class="bg-gray-100 h-screen">
    <div class="flex h-full">
        <aside class="bg-white shadow-md w-64 flex-none">
            <div class="p-5">
                <h1 class="text-xl font-bold mb-5">GX1 Platform</h1>
                <nav>
                    <button class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded w-full text-left">Employees</button>
                </nav>
            </div>
        </aside>
        <main class="flex-grow p-6">
            <h2 class="text-2xl font-bold mb-6">Employee Registration</h2>
            <div class="bg-white p-6 rounded shadow-md">
                <form class="space-y-4">
                    <div class="flex space-x-4">
                        <div class="w-1/2">
                            <label class="block text-sm font-medium mb-1" for="first_name">First Name *</label>
                            <input type="text" id="first_name" class="border-gray-300 border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="First Name">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-sm font-medium mb-1" for="last_name">Last Name *</label>
                            <input type="text" id="last_name" class="border-gray-300 border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Last Name">
                        </div>
                    </div>
                    <div class="w-full">
                        <label class="block text-sm font-medium mb-1" for="email">Email *</label>
                        <input type="email" id="email" class="border-gray-300 border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Email">
                    </div>
                    <div>
                        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded">Save</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
