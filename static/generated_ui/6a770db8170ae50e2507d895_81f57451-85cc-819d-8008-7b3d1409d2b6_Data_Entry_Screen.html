<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <div class="bg-white shadow-lg min-w-[200px]">
            <div class="p-6">
                <h1 class="text-lg font-bold mb-4">GX1 Platform</h1>
                <button class="bg-green-500 text-white w-full p-3 rounded focus:outline-none hover:bg-green-600">Data Entry</button>
            </div>
        </div>
        <!-- Main Content -->
        <div class="flex-1 p-6">
            <h2 class="text-2xl font-bold mb-4">Data Entry</h2>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <form>
                    <div class="space-y-4">
                        <div>
                            <label for="field1" class="block text-gray-700">Field 1 *</label>
                            <input type="text" id="field1" class="mt-1 w-full border border-gray-300 rounded focus:border-green-500 focus:ring focus:ring-green-300 focus:ring-opacity-50 p-2" required>
                        </div>
                        <div>
                            <label for="field2" class="block text-gray-700">Field 2 *</label>
                            <input type="text" id="field2" class="mt-1 w-full border border-gray-300 rounded focus:border-green-500 focus:ring focus:ring-green-300 focus:ring-opacity-50 p-2" required>
                        </div>
                        <div>
                            <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 focus:outline-none">Submit</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
